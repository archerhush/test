<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tridactyl iframe — many elements</title>

  <style>
    body {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px;
      font: 18px/1.5 system-ui, sans-serif;
    }

    iframe {
      display: block;
      width: 100%;
      height: 400px;
      box-sizing: border-box;
      border: 5px solid #2563a8;
      border-radius: 8px;
      background: white;
    }

    code {
      padding: 0.15em 0.35em;
      border-radius: 4px;
      background: #eee;
    }
  </style>
</head>

<body>
  <h1>Iframe with many hintable elements</h1>

  <p>
    The blue-bordered area is an iframe containing 300 links.
    Its internal document is taller than the frame, so it has its own scrollbar.
    Link 250 is the highlighted target.
  </p>

  <iframe id="test-frame" title="Iframe containing 300 links"></iframe>

  <script>
    var links = "";

    for (var number = 1; number <= 300; number++) {
      var isTarget = number === 250;

      links +=
        '<a class="item' + (isTarget ? ' target' : '') + '"' +
        ' id="' + (isTarget ? 'target-link' : 'link-' + number) + '"' +
        ' href="#link-' + number + '">' +
        'Link ' + number + (isTarget ? ' — TARGET' : '') +
        '</a>';
    }

    var frameDocument =
      '<!doctype html>' +
      '<html lang="en">' +
      '<head>' +
      '<meta charset="utf-8">' +
      '<style>' +

      'html, body {' +
      '  margin: 0;' +
      '  padding: 0;' +
      '}' +

      'body {' +
      '  padding: 16px;' +
      '  font: 18px/1.5 system-ui, sans-serif;' +
      '  background: #f4f6f8;' +
      '}' +

      'h2 {' +
      '  position: sticky;' +
      '  top: 0;' +
      '  margin: 0 0 16px;' +
      '  padding: 12px;' +
      '  border: 1px solid #9ca3af;' +
      '  border-radius: 6px;' +
      '  background: white;' +
      '  font-size: 18px;' +
      '}' +

      '.item {' +
      '  display: block;' +
      '  min-height: 54px;' +
      '  box-sizing: border-box;' +
      '  margin: 0 0 10px;' +
      '  padding: 14px;' +
      '  color: #111;' +
      '  text-decoration: none;' +
      '  border: 1px solid #9ca3af;' +
      '  border-radius: 6px;' +
      '  background: white;' +
      '}' +

      '.item:hover, .item:focus {' +
      '  outline: 4px solid #2563a8;' +
      '  outline-offset: 2px;' +
      '}' +

      '.target {' +
      '  border: 5px solid #d97706;' +
      '  background: #fff3a6;' +
      '  font-weight: 700;' +
      '}' +

      '</style>' +
      '</head>' +

      '<body>' +
      '<h2>Iframe document — 300 links; target is link 250</h2>' +
      links +
      '</body>' +
      '</html>';

    document.getElementById("test-frame").srcdoc = frameDocument;
  </script>
</body>
</html>
